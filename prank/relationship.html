<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relationship started</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div class="icon">
        <div>
            🤎 I LOVE YOU TOO! MY LOVE :p🤎
        </div>
    </div>
    <div class="container">
        <h1 class="title">
            I am so glad that you said yes!🫶💕
        </h1>
        <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExcnU4OW01cmNubHNwcG84cXhuNW9rZ3gwYzN0d2N6bmppOXc2cGptNSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/aCzTklXxTjF3NlzXlN/200.webp" alt="gif" class="gif">
        <div class="input">
            <h1 class="relationship_starting">Let's start our relationship!</h1>
            <label for="name" class="name">
                <p>
                    Name:
                </p>
                <input type="text" class="name" name="name" placeholder="Enter your name">
            </label>
            <main>
                <label for="date" class="date">
                    <p>
                        Date of relationship starting:
                    </p>
                    <input type="date" class="date" name="date">
                </label>
            </main>
            <main>
                <p>
                    Write a message to me back:
                </p>
                <label for="message" class="message">
                    <textarea id="message" name="message" placeholder="Write a message to me back"></textarea>
                </label>
            </main>
        </div>
        <div class="btn-group">
            <button type="submit" class="submit">Submit</button>
            <button type="submit" class="back">Back</button>
        </div>
    </div>
</body>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="javascript2.js"></script>
</html>
